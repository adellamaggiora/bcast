<ion-app>
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>
        Bcast v{{ appVersion }}
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-split-pane contentId="main-content">

      <ion-menu contentId="main-content" type="overlay">

        <ion-list>
          <ion-list-header *ngIf="(userService.userSession.get$() | async)?.user?.email?.length"> 
            {{ (userService.userSession.get$() | async)?.user?.email }} 
          </ion-list-header>
          <ion-menu-toggle *ngFor="let p of appPages; let i = index">
            <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false"
              routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <ion-menu-toggle>
          <ion-item (click)="logout()" lines="none" detail="false">
            <ion-icon aria-hidden="true" slot="start" name="log-out-outline"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>
        
      </ion-menu>

      <ion-router-outlet id="main-content"></ion-router-outlet>
    </ion-split-pane>
  </ion-content>

</ion-app>
