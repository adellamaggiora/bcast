<ion-button shape="round" color="tertiary" id="open-modal">
  <ion-icon name="options-outline" slot="icon-only"></ion-icon>
</ion-button>
<ion-chip>Availability</ion-chip>
<ion-chip>Distance</ion-chip>
<ion-chip>Tag</ion-chip>
<ion-chip>Partecipation</ion-chip>
<ion-chip>Author</ion-chip>

<ion-modal trigger="open-modal" (willDismiss)="onWillDismiss($event)">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="cancel()">Cancel</ion-button>
        </ion-buttons>
        <!-- <ion-title>Set bcast filters</ion-title> -->
        <ion-buttons slot="end">
          <ion-button (click)="confirm()" [strong]="true">Confirm</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-item>
        <ion-text>
          <h1>Set all filters here</h1>
        </ion-text>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Enter your name</ion-label>
        <ion-input type="text" placeholder="Your name" [(ngModel)]="name"></ion-input>
      </ion-item>
    </ion-content>
  </ng-template>
</ion-modal>
