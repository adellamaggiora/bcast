<div class="d-flex align-items-center justify-content-center">
  <ion-button shape="round" color="tertiary" id="open-main-modal">
    <ion-icon name="options-outline" slot="icon-only"></ion-icon>
  </ion-button>
  <ion-chip id="open-availability-modal">Availability</ion-chip>
  <ion-chip id="open-distance-modal">Distance</ion-chip>
  <ion-chip id="open-tag-modal">Tag</ion-chip>
  <ion-chip id="open-partecipation-modal">Partecipation</ion-chip>
  <ion-chip id="open-author-modal">Author</ion-chip>
</div>

<ng-template #modalButtons>
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-button (click)="cancel()">Cancel</ion-button>
      </ion-buttons>
      <!-- <ion-title>Set bcast filters</ion-title> -->
      <ion-buttons slot="end">
        <ion-button (click)="confirm()" [strong]="true">Confirm</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
</ng-template>

<ion-modal trigger="open-main-modal" (willDismiss)="onWillDismiss($event)">
  <ng-template>

    <ng-container *ngTemplateOutlet="modalButtons"></ng-container>

    <ion-content class="ion-padding">
      <ion-item>
        <ng-container *ngTemplateOutlet="availability"></ng-container>
      </ion-item>
      <ion-item>
        <ng-container *ngTemplateOutlet="distance"></ng-container>
      </ion-item>
      <ion-item>
        <ng-container *ngTemplateOutlet="tag"></ng-container>
      </ion-item>
      <ion-item>
        <ng-container *ngTemplateOutlet="partecipation"></ng-container>
      </ion-item>
      <ion-item>
        <ng-container *ngTemplateOutlet="author"></ng-container>
      </ion-item>
    </ion-content>
    
  </ng-template>
</ion-modal>

<ion-modal trigger="open-availability-modal">
  <ng-template #availability>
    <ng-container *ngTemplateOutlet="modalButtons"></ng-container>
    availability works
  </ng-template>
</ion-modal>

<ion-modal trigger="open-distance-modal">
  <ng-template #distance>
    <ng-container *ngTemplateOutlet="modalButtons"></ng-container>
    Distance works
  </ng-template>
</ion-modal>

<ion-modal trigger="open-tag-modal">
  <ng-template #tag>
    <ng-container *ngTemplateOutlet="modalButtons"></ng-container>tag works
  </ng-template>
</ion-modal>

<ion-modal trigger="open-partecipation-modal">
  <ng-template #partecipation>
    <ng-container *ngTemplateOutlet="modalButtons"></ng-container>partecipation
    works
  </ng-template>
</ion-modal>

<ion-modal trigger="open-author-modal">
  <ng-template #author>
    <ng-container *ngTemplateOutlet="modalButtons"></ng-container>
    author works
  </ng-template>
</ion-modal>
