<div class="d-flex align-items-center justify-content-center">
  <ion-button shape="round" color="tertiary" (click)="openModal(ModalContentEnum.All)">
    <ion-icon name="options-outline" slot="icon-only"></ion-icon>
  </ion-button>
  <ion-chip (click)="openModal(ModalContentEnum.Availabilty)">Availability</ion-chip>
  <ion-chip (click)="openModal(ModalContentEnum.Distance)">Distance</ion-chip>
  <ion-chip (click)="openModal(ModalContentEnum.Tag)">Tag</ion-chip>
  <ion-chip (click)="openModal(ModalContentEnum.Partecipation)">Partecipation</ion-chip>
  <ion-chip (click)="openModal(ModalContentEnum.Author)">Author</ion-chip>
</div>

<ion-modal (willDismiss)="onWillDismiss($event)">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="cancel()">Cancel</ion-button>
        </ion-buttons>
        <!-- <ion-title>Set bcast filters</ion-title> -->
        <ion-buttons slot="end">
          <ion-button (click)="confirm()" [strong]="true">Confirm</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ion-item *ngIf="modalContent === ModalContentEnum.Availabilty || modalContent === ModalContentEnum.All">
        <ng-container *ngTemplateOutlet="availability"></ng-container>
      </ion-item>
      <ion-item *ngIf="modalContent === ModalContentEnum.Distance || modalContent === ModalContentEnum.All">
        <ng-container *ngTemplateOutlet="distance"></ng-container>
      </ion-item>
      <ion-item *ngIf="modalContent === ModalContentEnum.Tag || modalContent === ModalContentEnum.All">
        <ng-container *ngTemplateOutlet="tag"></ng-container>
      </ion-item>
      <ion-item *ngIf="modalContent === ModalContentEnum.Partecipation || modalContent === ModalContentEnum.All">
        <ng-container *ngTemplateOutlet="partecipation"></ng-container>
      </ion-item>
      <ion-item *ngIf="modalContent === ModalContentEnum.Author || modalContent === ModalContentEnum.All">
        <ng-container *ngTemplateOutlet="author"></ng-container>
      </ion-item>
    </ion-content>
  </ng-template>
</ion-modal>

<ng-template #availability> availability works </ng-template>

<ng-template #distance> Distance works </ng-template>

<ng-template #tag> tag works </ng-template>

<ng-template #partecipation> partecipation works </ng-template>

<ng-template #author> author works </ng-template>
