<div *ngIf="map">
  <div class="explore-box" (click)="onExploreHereClick()">
    Explore here
  </div>
  <ion-button class="position-button" shape="round" color="tertiary" (click)="onPositionClick()">
    <ion-icon name="locate-outline"></ion-icon>
  </ion-button>
</div>

<div *ngIf="!map" class="h-100 ion-align-items-center ion-justify-content-center" style="display: flex;">
  <ion-spinner color="primary"></ion-spinner>
</div>

<div id="map" class="h-100 w-100"></div>
