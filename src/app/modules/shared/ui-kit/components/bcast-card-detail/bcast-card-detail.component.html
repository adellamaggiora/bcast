<ion-card *ngIf="bcastDetail" class="ion-padding">
  <ion-card-header>
    <ion-card-title>
      Broadcast card detail
    </ion-card-title>
  </ion-card-header>
  <ion-button (click)="onChatClick()" *ngIf="bcastDetail.joined">Chat</ion-button>
  <ion-button (click)="onJoinClick()" *ngIf="!bcastDetail.joined">Join</ion-button>
</ion-card>
