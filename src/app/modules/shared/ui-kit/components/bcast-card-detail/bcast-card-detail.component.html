<ion-card *ngIf="bcastDetail" class="ion-padding">
  <img [src]="imageSrc" />

  <ion-card-header>
    <ion-card-title>{{ bcastDetail.title }}</ion-card-title>
    <ion-card-subtitle color="primary">
      {{ bcastDetail.expiresAt | date : dateFns.formatString() }}
    </ion-card-subtitle>
    <ion-card-subtitle>
      <ion-icon name="rocket"></ion-icon>
      <ion-text>
        {{ bcastDetail.distMeters | metersToKm | number : "1.0-1" }} Km from you
      </ion-text>
    </ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <ion-text>
      {{ bcastDetail.content }}
    </ion-text>
  </ion-card-content>

  <!-- <ion-thumbnail *ngIf="bcastDetail?.location" class="ion-padding">
    <app-map-preview [position]="bcastDetail.location"></app-map-preview>
  </ion-thumbnail> -->

  <ion-button
    expand="block"
    color="tertiary"
    (click)="onChatClick()"
    *ngIf="bcastDetail.joined"
    >Chat</ion-button
  >

  <ion-button
    expand="block"
    color="tertiary"
    (click)="onJoinClick()"
    *ngIf="!bcastDetail.joined"
    >Join</ion-button
  >
</ion-card>
