<ng-container *ngIf="formValidator?.formGroup" [formGroup]="formValidator.formGroup">
  <ion-list>
    <ion-item>
      <ion-label position="fixed">Email: </ion-label>
      <ion-input disabled [value]="userSession?.user?.email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="fixed">Username: </ion-label>
      <ion-input color="primary" formControlName="username"></ion-input>
      <span slot="error">Name must be between 2 and 16 characters</span>
    </ion-item>
  </ion-list>

  <ion-button (click)="save()" [disabled]="formValidator.formButtonDisabled"> Save </ion-button>
</ng-container>
