<ion-list [formGroup]="formValidator?.formGroup">
  <ion-item>
    <ion-input placeholder="Enter tag" [(ngModel)]="newTag" (keydown.enter)="addTag()" (keydown.space)="addTag()" />
  </ion-item>

  <ion-item>
    <div>
      <ion-chip color="primary" *ngFor="let t of formValidator?.tag?.value; let i = index;">
        {{ t }}
        <ion-label>{{ t }}</ion-label>
        <ion-icon name="close-circle" (click)="removeTag(i)"></ion-icon>
      </ion-chip>
    </div>
  </ion-item>
</ion-list>

<ion-button slot="end" (click)="save()"> Save </ion-button>
