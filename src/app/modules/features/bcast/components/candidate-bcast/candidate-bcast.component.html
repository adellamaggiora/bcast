<div *ngFor="let bcast of bcastService.candidate.get$() | async">
    <app-bcast-card 
        [bcast]="bcast" 
        [joined]="false"
        [userTag]="(userService?.userInfo.get$() | async)?.tag"
        (hide)="onHide($event)"
        (join)="onJoin($event)"
        >
    </app-bcast-card>
</div>

<ion-note *ngIf="!(bcastService.candidate.get$() | async)?.length" class="my-3 text-center">
    No matching broadcast in your area
</ion-note>
