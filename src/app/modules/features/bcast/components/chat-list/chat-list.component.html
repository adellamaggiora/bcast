<div *ngFor="let bcast of bcastService.chatList.get$() | async">
  <app-card 
      [bcast]="bcast" 
      [joined]="true" 
      [userLocation]="null"
      [userTag]="(userService?.userInfo.get$() | async)?.tag"
      >
  </app-card>
</div>

<ion-note *ngIf="!(bcastService.chatList.get$() | async)?.length" class="my-3 text-center">
  You don't have any chat yet
</ion-note>
