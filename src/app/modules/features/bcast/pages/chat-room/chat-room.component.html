<ion-content class="ion-padding">

  <ng-container *ngFor="let message of messages" class="message">
    <ion-card [ngClass]="isMyMessage(message) ? 'ms-5' : 'me-5'">
      <ion-card-content>
        {{ message.content }}
      </ion-card-content>
    </ion-card>
  </ng-container>

</ion-content>

<ion-item class="ion-padding">
  <ion-input (keyup.enter)="sendMessage()" placeholder="Type your message here..." [(ngModel)]="message">
  </ion-input>
</ion-item>
